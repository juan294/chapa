# Bundle Size Analysis
#
# Two jobs:
# 1. `analyze` — Standard build, measures aggregate directory sizes, comments
#    on PRs with a size table.
# 2. `bundle-analyzer` — Runs @next/bundle-analyzer (ANALYZE=true), uploads
#    interactive HTML treemap reports as CI artifacts, and enforces a 350 KB
#    per-file budget on JS bundles.
#
# NOTE: Turbopack limitation (see GitHub issue #303)
#
# Next.js builds with Turbopack (the default in dev and increasingly in
# production) do NOT emit per-route JavaScript sizes in the build output.
# The classic Webpack-based build prints a table like:
#
#   Route                              Size     First Load JS
#   /                                  5.2 kB         89 kB
#   /u/[handle]                        3.1 kB         87 kB
#
# Turbopack omits this entirely. As a result, the `analyze` job measures
# aggregate directory sizes (.next/static, .next/server, total) and lists
# the largest individual JS files — but cannot report per-route First Load
# JS budgets.
#
# The `bundle-analyzer` job runs with ANALYZE=true which triggers the
# @next/bundle-analyzer Webpack plugin. When Turbopack is the bundler this
# may not produce the interactive treemap. In that case the job still
# uploads whatever .next/analyze/ output exists and falls back to
# per-file size checks.
#
# For detailed per-route analysis, run locally with Webpack:
#   ANALYZE=true pnpm --filter @chapa/web build
# This requires @next/bundle-analyzer to be configured in next.config.ts.
#
# Turbopack tracking: https://github.com/vercel/next.js/issues/49887

name: Bundle Size Analysis

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  analyze:
    name: Analyze Bundle Size
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          GITHUB_CLIENT_ID: dummy
          GITHUB_CLIENT_SECRET: dummy
          NEXTAUTH_SECRET: dummy-secret-for-ci-32-characters
          UPSTASH_REDIS_REST_URL: https://dummy.upstash.io
          UPSTASH_REDIS_REST_TOKEN: dummy

      - name: Analyze bundle
        id: bundle
        working-directory: apps/web
        run: |
          echo "## Bundle Size Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Directory | Raw | Gzipped |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-----|---------|" >> "$GITHUB_STEP_SUMMARY"

          if [ -d ".next/static" ]; then
            STATIC_SIZE=$(du -sh .next/static | cut -f1)
            STATIC_BYTES=$(du -sb .next/static | cut -f1)
            echo "| \`.next/static\` | $STATIC_SIZE | — |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -d ".next/server" ]; then
            SERVER_SIZE=$(du -sh .next/server | cut -f1)
            echo "| \`.next/server\` | $SERVER_SIZE | — |" >> "$GITHUB_STEP_SUMMARY"
          fi

          TOTAL_SIZE=$(du -sh .next | cut -f1)
          echo "| **Total \`.next\`** | **$TOTAL_SIZE** | — |" >> "$GITHUB_STEP_SUMMARY"

          # Compute gzipped total for client JS chunks (individually compressed — matches HTTP/2 delivery)
          if [ -d ".next/static/chunks" ]; then
            GZIP_TOTAL=0
            while IFS= read -r f; do
              SIZE=$(gzip -c "$f" | wc -c)
              GZIP_TOTAL=$((GZIP_TOTAL + SIZE))
            done < <(find .next/static/chunks -name "*.js" -type f)
            GZIP_KB=$((GZIP_TOTAL / 1024))
            RAW_CHUNKS_BYTES=$(find .next/static/chunks -name "*.js" -type f | xargs wc -c 2>/dev/null | tail -1 | awk '{print $1}')
            RAW_CHUNKS_KB=$((RAW_CHUNKS_BYTES / 1024))
            echo "| \`.next/static/chunks\` JS | ${RAW_CHUNKS_KB} KB | **${GZIP_KB} KB** |" >> "$GITHUB_STEP_SUMMARY"
            echo "chunks_raw_kb=${RAW_CHUNKS_KB}" >> "$GITHUB_OUTPUT"
            echo "chunks_gzip_kb=${GZIP_KB}" >> "$GITHUB_OUTPUT"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Largest JS bundles" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find .next -name "*.js" -type f -exec du -h {} + | sort -rh | head -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "static_size=${STATIC_SIZE:-N/A}" >> "$GITHUB_OUTPUT"
          echo "server_size=${SERVER_SIZE:-N/A}" >> "$GITHUB_OUTPUT"
          echo "total_size=${TOTAL_SIZE}" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const staticSize = '${{ steps.bundle.outputs.static_size }}';
            const serverSize = '${{ steps.bundle.outputs.server_size }}';
            const totalSize = '${{ steps.bundle.outputs.total_size }}';
            const chunksRawKb = '${{ steps.bundle.outputs.chunks_raw_kb }}';
            const chunksGzipKb = '${{ steps.bundle.outputs.chunks_gzip_kb }}';

            const chunksRow = chunksRawKb
              ? `| \`.next/static/chunks\` JS | ${chunksRawKb} KB | **${chunksGzipKb} KB** |`
              : '';

            const body = [
              '## Bundle Size Report',
              '',
              '| Directory | Raw | Gzipped |',
              '|-----------|-----|---------|',
              `| \`.next/static\` | ${staticSize} | — |`,
              `| \`.next/server\` | ${serverSize} | — |`,
              `| **Total \`.next\`** | **${totalSize}** | — |`,
              chunksRow,
              '',
              `> Measured at commit ${context.sha.substring(0, 7)}`,
            ].filter(Boolean).join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## Bundle Size Report';
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  bundle-analyzer:
    name: Bundle Analyzer Report
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with bundle analyzer
        run: pnpm --filter @chapa/web build
        env:
          ANALYZE: "true"
          GITHUB_CLIENT_ID: dummy
          GITHUB_CLIENT_SECRET: dummy
          NEXTAUTH_SECRET: dummy-secret-for-ci-32-characters
          UPSTASH_REDIS_REST_URL: https://dummy.upstash.io
          UPSTASH_REDIS_REST_TOKEN: dummy

      - name: Upload analyzer report
        uses: actions/upload-artifact@v7
        with:
          name: bundle-analyzer-report
          path: |
            apps/web/.next/analyze/
          retention-days: 14
          if-no-files-found: warn

      - name: Check JS bundle sizes (350 KB budget)
        working-directory: apps/web
        run: |
          BUDGET_KB=350
          BUDGET_BYTES=$((BUDGET_KB * 1024))
          FAILED=0

          echo "## Bundle Analyzer — Size Budget Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Budget: **${BUDGET_KB} KB** per JS file in \`.next/static/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Check .next/static JS files (client bundles delivered to browsers)
          if [ -d ".next/static" ]; then
            OVER_BUDGET=""
            while IFS=$'\t' read -r SIZE_BYTES FILE; do
              SIZE_KB=$((SIZE_BYTES / 1024))
              if [ "$SIZE_BYTES" -gt "$BUDGET_BYTES" ]; then
                OVER_BUDGET="${OVER_BUDGET}\n| \`${FILE}\` | ${SIZE_KB} KB | :red_circle: OVER |"
                FAILED=1
              fi
            done < <(find .next/static -name "*.js" -type f -print0 | xargs -0 -I{} sh -c 'printf "%s\t%s\n" "$(wc -c < "$1")" "$1"' _ {})

            if [ -n "$OVER_BUDGET" ]; then
              echo "| File | Size | Status |" >> "$GITHUB_STEP_SUMMARY"
              echo "|------|------|--------|" >> "$GITHUB_STEP_SUMMARY"
              echo -e "$OVER_BUDGET" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            else
              echo ":white_check_mark: All client JS files are under ${BUDGET_KB} KB." >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi

            echo "### Top 15 client JS files by size" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            find .next/static -name "*.js" -type f -exec du -h {} + | sort -rh | head -15 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo ":warning: \`.next/static\` not found — Turbopack may structure output differently." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Report on analyzer HTML output
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -d ".next/analyze" ]; then
            FILE_COUNT=$(find .next/analyze -name "*.html" -type f | wc -l | tr -d ' ')
            echo ":bar_chart: Bundle analyzer generated **${FILE_COUNT}** HTML report(s)." >> "$GITHUB_STEP_SUMMARY"
            echo "Download the **bundle-analyzer-report** artifact to view interactive treemaps." >> "$GITHUB_STEP_SUMMARY"
          else
            echo ":warning: No \`.next/analyze/\` directory found." >> "$GITHUB_STEP_SUMMARY"
            echo "Turbopack may not support \`@next/bundle-analyzer\` treemap generation." >> "$GITHUB_STEP_SUMMARY"
            echo "See [Next.js #49887](https://github.com/vercel/next.js/issues/49887) for tracking." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::One or more JS files in .next/static/ exceed the ${BUDGET_KB} KB budget."
            exit 1
          fi
