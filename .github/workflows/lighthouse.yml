# Lighthouse CI — Core Web Vitals & accessibility tracking
#
# Runs Lighthouse audits on key pages (including the share page /u/:handle)
# after a successful build. Uses the build artifact from the CI workflow to
# avoid rebuilding. Results are uploaded to temporary public storage
# (free, no server needed).
#
# Accessibility is ENFORCED (error, minScore 0.9) — an a11y regression on any
# audited page fails this job and blocks the PR. Performance, best-practices,
# and SEO remain advisory (warn only) while the team calibrates those
# thresholds, so the job is no longer marked continue-on-error.

name: Lighthouse CI

on:
  pull_request:
    branches: [develop, main]

# Cancel in-progress runs on the same PR
concurrency:
  group: lighthouse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    # Accessibility is enforced (see lighthouserc.json) — this job now blocks
    # PRs on a11y regressions. Performance/SEO/best-practices stay advisory.

    env:
      # Dummy values for build — real values are in Vercel
      GITHUB_CLIENT_ID: dummy
      GITHUB_CLIENT_SECRET: dummy
      NEXTAUTH_SECRET: dummy-secret-for-ci-32-characters
      UPSTASH_REDIS_REST_URL: https://dummy.upstash.io
      UPSTASH_REDIS_REST_TOKEN: dummy

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run Lighthouse CI
        run: |
          pnpm dlx @lhci/cli autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
