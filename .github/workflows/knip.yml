name: Dead Code Detection

on:
  push:
    branches: [develop]
    paths-ignore:
      - "docs/research/**"
      - "docs/plans/**"
      - "docs/agents/**"
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  develop_push_source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/validate-merged-pr.yml
    with:
      required_checks: '["Knip Dead Code Analysis"]'

  knip:
    name: Knip Dead Code Analysis
    needs: develop_push_source
    if: always() && needs.develop_push_source.outputs.validated_by_pr != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Knip (dead code detection)
        run: pnpm exec knip

      - name: Check unused dependencies
        run: pnpm exec knip --dependencies
