name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# CI-cost rule: a newer push to the same ref supersedes the in-progress run, so
# don't keep paying to verify a commit nobody will ship. `main` is excluded from
# cancellation — release-verification evidence is bound to an exact commit and
# must always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  develop_push_source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/validate-merged-pr.yml
    with:
      required_checks: '["Lint & Typecheck","Test","Contract (real DB)","Build","E2E Tests","Deployment Smoke"]'

  lint-and-typecheck:
    name: Lint & Typecheck
    needs: develop_push_source
    if: always() && needs.develop_push_source.outputs.validated_by_pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run check:circular
      - run: pnpm run validate:migrations
      - name: Craft propagation guard (#680)
        run: bash scripts/check-craft-propagation.sh
      - name: Vercel config location guard (#1052)
        id: vercel-config
        run: pnpm run check:vercel-config

      - name: Write lint and configuration evidence
        if: always()
        env:
          PRODUCER_STATUS: ${{ job.status }}
          VERCEL_CONFIG_STATUS: ${{ steps.vercel-config.outcome }}
        run: |
          mkdir -p .release-evidence
          STATUS="$PRODUCER_STATUS"
          REASON="Lint, typecheck, and configuration checks completed."
          if [ "$STATUS" != "success" ]; then
            STATUS="failed"
            REASON="One or more lint, typecheck, or configuration checks failed."
          else
            STATUS="passed"
          fi
          EVIDENCE_URI="github-actions://${{ github.repository }}/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs/lint-and-typecheck"
          jq -n \
            --arg status "$STATUS" \
            --arg reason "$REASON" \
            --arg runId "${{ github.run_id }}" \
            --arg commitSha "${{ github.sha }}" \
            --arg evidenceUri "$EVIDENCE_URI" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, runId: $runId, environment: "ci-build", candidateIdentity: $commitSha,
              results: [{scenarioId: "operations.vercel-cron-registration",
                environment: "ci-build", status: $status,
                startedAt: $generatedAt, finishedAt: $generatedAt, runner: "script",
                evidence: {configuration: [$evidenceUri]}, fixtures: [], notes: $reason}]}' \
            > .release-evidence/lint-and-vercel-config.json

      - name: Upload lint and configuration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-lint-and-typecheck
          path: .release-evidence/lint-and-vercel-config.json
          if-no-files-found: error
          retention-days: 30

  # WHY sharded (#ci-perf): the unit+coverage suite is a CPU-bound ~5.5min
  # `vitest run --coverage` on a 2-core runner. Splitting it across 2 shards
  # (each ~half the wall-clock) roughly halves the unit-test critical path.
  # Each shard emits a Vitest *blob* report (raw run data, coverage folded in)
  # that the `test` gate below merges to enforce the REAL coverage thresholds
  # exactly once. Per-shard coverage thresholds are forced to 0 so a partial
  # shard can never trip the gate on its own — enforcement happens only on the
  # merged result. fail-fast:false so one failing shard still lets the other
  # finish (full signal in one run).
  test-shard:
    name: Test Shard (${{ matrix.shard }})
    needs: develop_push_source
    if: always() && needs.develop_push_source.outputs.validated_by_pr != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Test shard with coverage (blob report)
        env:
          # Tells vitest.config.ts to omit the per-path coverage thresholds
          # (apps/web/lib/impact/**, stats-integrity.ts) for this run — a
          # single shard only sees a subset of test files and can never
          # satisfy a full-suite floor on its own. Real enforcement (global
          # AND per-path) happens once, on the merged report, in the `test`
          # job below. Must NOT be set there.
          VITEST_SHARD_RUN: "true"
        run: |
          # blob feeds the merge gate; github reporter surfaces failing tests as
          # inline annotations (blob alone prints nothing per-test on failure).
          pnpm exec vitest run \
            --shard=${{ matrix.shard }}/2 \
            --coverage \
            --reporter=blob \
            --reporter=github-actions \
            --coverage.thresholds.lines=0 \
            --coverage.thresholds.functions=0 \
            --coverage.thresholds.statements=0 \
            --coverage.thresholds.branches=0

      - name: Upload blob report
        # always() so a failing shard still uploads its blob for offline triage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/*
          # .vitest-reports is a dot-dir, so hidden files must be included
          include-hidden-files: true
          retention-days: 1

  # WHY a separate gate job named exactly "Test": branch protection on
  # develop/main requires a status check literally named "Test". A matrix job
  # publishes per-shard checks ("Test Shard (1)"…), not "Test", so this
  # aggregator preserves the required-check name. It merges the shard blobs,
  # enforces the REAL coverage thresholds once, and owns the portfolio coverage
  # report + scoring integrity gate (moved off the old monolithic test job).
  # `if: always()` so it runs even when a shard fails, then fails itself if any
  # shard was not successful — keeping "Test" red on a real failure.
  test:
    name: Test
    needs: [develop_push_source, test-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reuse verified PR validation
        if: needs.develop_push_source.outputs.validated_by_pr == 'true'
        run: echo "Exact merge SHA already passed every required PR check."

      - name: Fail if any shard failed
        if: needs.develop_push_source.outputs.validated_by_pr != 'true' && needs.test-shard.result != 'success'
        run: |
          echo "::error::One or more unit-test shards did not succeed (result: ${{ needs.test-shard.result }})"
          exit 1

      - uses: actions/checkout@v6
        if: needs.develop_push_source.outputs.validated_by_pr != 'true'
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        if: needs.develop_push_source.outputs.validated_by_pr != 'true'
      - uses: actions/setup-node@v6
        if: needs.develop_push_source.outputs.validated_by_pr != 'true'
        with:
          node-version: 20
          cache: pnpm
      - if: needs.develop_push_source.outputs.validated_by_pr != 'true'
        run: pnpm install --frozen-lockfile

      - name: Download shard blob reports
        if: needs.develop_push_source.outputs.validated_by_pr != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge coverage & enforce thresholds
        if: needs.develop_push_source.outputs.validated_by_pr != 'true'
        id: test
        run: |
          # Merge both shard blobs into a single coverage report and enforce the
          # REAL thresholds (from vitest.config.ts) exactly once on the union.
          # Capture the exit status so a test failure OR a coverage-threshold
          # breach (both non-zero) fails this gate, while still recording counts.
          set +e
          OUTPUT=$(pnpm exec vitest run --merge-reports --coverage 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"

          # Extract test counts from Vitest output
          # Vitest prints: "Tests  42 passed | 1 failed (43)"
          PASSED=$(echo "$OUTPUT" | grep -oP 'Tests\s+\K\d+(?=\s+passed)' || echo "0")
          FAILED=$(echo "$OUTPUT" | grep -oP '\|\s+\K\d+(?=\s+failed)' || echo "0")
          TOTAL=$((PASSED + FAILED))

          echo "test_count=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "tests_passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "tests_failed=$FAILED" >> "$GITHUB_OUTPUT"

          # Propagate any failure (failed tests or unmet coverage thresholds).
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Merged unit run failed (exit $STATUS): failed tests or coverage below threshold"
            exit "$STATUS"
          fi

      - name: Report coverage to portfolio
        if: needs.develop_push_source.outputs.validated_by_pr != 'true' && success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        continue-on-error: true
        env:
          COVERAGE_SECRET: ${{ secrets.COVERAGE_SECRET }}
        run: |
          COVERAGE_JSON="coverage/coverage-summary.json"
          if [ ! -f "$COVERAGE_JSON" ]; then
            echo "No coverage summary found — skipping report."
            exit 0
          fi

          BODY=$(node -e "
            const c = require('./${COVERAGE_JSON}').total;
            console.log(JSON.stringify({
              repo: '${{ github.repository }}',
              testCount: ${{ steps.test.outputs.test_count }},
              coveragePercent: parseFloat(c.lines.pct.toFixed(2)),
              passing: ${{ steps.test.outputs.tests_passed }},
              failing: ${{ steps.test.outputs.tests_failed }},
              source: {
                provider: 'github-actions',
                repository: '${{ github.repository }}',
                runId: '${{ github.run_id }}',
                workflowRef: '${{ github.workflow_ref }}'
              }
            }));
          ")

          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$COVERAGE_SECRET" -hex | awk '{print $NF}')

          curl -sf -X POST https://portfolio.thecreativetoken.com/api/coverage \
            -H 'Content-Type: application/json' \
            -H "X-Coverage-Signature-256: sha256=${SIG}" \
            -d "$BODY"

          echo "Coverage reported: $(echo "$BODY" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(d.testCount+' tests, '+d.coveragePercent+'% coverage')")"

      - name: Scoring integrity gate
        if: needs.develop_push_source.outputs.validated_by_pr != 'true' && github.event_name == 'pull_request'
        run: |
          SCORING_FILES="apps/web/lib/impact/ apps/web/lib/github/merge.ts packages/shared/src/stats-aggregation.ts packages/shared/src/types.ts packages/shared/src/constants.ts packages/shared/src/stats-schema.ts apps/web/lib/github/stats-integrity.ts apps/web/lib/github/queries.ts apps/web/lib/github/client.ts apps/web/lib/github/stats.ts apps/web/lib/profile/materialize-profile.ts apps/web/lib/profile/public-profile.ts"
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- $SCORING_FILES || true)
          if [ -n "$CHANGED" ]; then
            echo "::notice::Scoring files changed — running integrity tests"
            echo "$CHANGED"
            pnpm vitest run --reporter=verbose apps/web/lib/impact/golden-profiles.test.ts apps/web/lib/impact/pipeline.test.ts apps/web/lib/github/merge.test.ts apps/web/lib/github/stats-integrity.test.ts packages/shared/src/stats-aggregation.test.ts
          else
            echo "No scoring files changed — skipping integrity gate"
          fi

      - name: Write aggregate unit and coverage evidence
        if: always() && needs.develop_push_source.outputs.validated_by_pr != 'true'
        env:
          PRODUCER_STATUS: ${{ job.status }}
          SHARD_STATUS: ${{ needs.test-shard.result }}
          MERGE_STATUS: ${{ steps.test.outcome }}
          TEST_COUNT: ${{ steps.test.outputs.test_count }}
          TESTS_PASSED: ${{ steps.test.outputs.tests_passed }}
          TESTS_FAILED: ${{ steps.test.outputs.tests_failed }}
        run: |
          mkdir -p .release-evidence
          STATUS="passed"
          REASON="Aggregate unit tests and coverage thresholds passed."
          if [ "$PRODUCER_STATUS" != "success" ] || [ "$SHARD_STATUS" != "success" ] || [ "$MERGE_STATUS" != "success" ]; then
            STATUS="failed"
            REASON="A unit-test shard, merged test run, or coverage threshold failed."
          fi
          jq -n \
            --arg scenarioId "ci.unit-and-coverage" \
            --arg status "$STATUS" \
            --arg reason "$REASON" \
            --arg repository "${{ github.repository }}" \
            --arg runId "${{ github.run_id }}" \
            --arg runAttempt "${{ github.run_attempt }}" \
            --arg jobName "Test" \
            --arg commitSha "${{ github.sha }}" \
            --arg shardStatus "$SHARD_STATUS" \
            --arg mergeStatus "$MERGE_STATUS" \
            --arg testCount "${TEST_COUNT:-0}" \
            --arg testsPassed "${TESTS_PASSED:-0}" \
            --arg testsFailed "${TESTS_FAILED:-0}" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, scenarioId: $scenarioId, status: $status, reason: $reason,
              source: {provider: "github-actions", repository: $repository, workflowRunId: $runId,
                workflowRunAttempt: $runAttempt, jobName: $jobName, commitSha: $commitSha},
              details: {shardStatus: $shardStatus, mergeStatus: $mergeStatus, testCount: $testCount,
                testsPassed: $testsPassed, testsFailed: $testsFailed}, generatedAt: $generatedAt}' \
            > .release-evidence/unit-and-coverage.json

      - name: Upload aggregate unit and coverage evidence
        if: always() && needs.develop_push_source.outputs.validated_by_pr != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-test
          path: .release-evidence/unit-and-coverage.json
          if-no-files-found: error
          retention-days: 30

  contract:
    name: Contract (real DB)
    needs: develop_push_source
    if: always() && needs.develop_push_source.outputs.validated_by_pr != 'true'
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_SECRET: contract-nextauth-secret-32-characters
      CHAPA_VERIFICATION_SECRET: test-verification-secret
      CRON_SECRET: test-cron-secret
      ADMIN_SECRET: test-admin-secret
      NEXT_PUBLIC_INSIGHTS_ENABLED: "true"
      NEXT_PUBLIC_STUDIO_ENABLED: "true"
      NEXT_PUBLIC_BITBUCKET_ENABLED: "true"
      NEXT_PUBLIC_CODEBERG_ENABLED: "true"
      NEXT_PUBLIC_GITLAB_ENABLED: "true"
      NEXT_PUBLIC_BASE_URL: http://localhost:3001
      GITHUB_CLIENT_ID: dummy
      GITHUB_CLIENT_SECRET: dummy
      UPSTASH_REDIS_REST_URL: https://dummy.upstash.io
      UPSTASH_REDIS_REST_TOKEN: dummy
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write-route registration
        run: pnpm run check:write-registration
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Export Supabase local env
        run: |
          supabase status -o env > supabase.env
          set -a
          . ./supabase.env
          set +a
          : "${API_URL:?Missing API_URL from Supabase CLI status output}"
          : "${SERVICE_ROLE_KEY:?Missing SERVICE_ROLE_KEY from Supabase CLI status output}"
          printf 'SUPABASE_URL=%s\n' "$API_URL" >> "$GITHUB_ENV"
          printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - run: supabase db reset
      - name: Contract tests
        id: contract-tests
        run: pnpm run test:contract
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: apps/web
      - name: Build web for journey E2E
        run: pnpm --filter @chapa/web build
      - name: Journey E2E (desktop + mobile)
        id: journey
        env:
          E2E_PRO_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm --filter @chapa/web exec playwright test e2e/journey.spec.ts --project=chromium --project=mobile

      - name: Write contract and local journey evidence
        if: always()
        env:
          PRODUCER_STATUS: ${{ job.status }}
          CONTRACT_STATUS: ${{ steps.contract-tests.outcome }}
          JOURNEY_STATUS: ${{ steps.journey.outcome }}
        run: |
          mkdir -p .release-evidence
          STATUS="passed"
          REASON="Contract tests and local-Supabase journey passed."
          if [ "$PRODUCER_STATUS" != "success" ] || [ "$CONTRACT_STATUS" != "success" ] || [ "$JOURNEY_STATUS" != "success" ]; then
            STATUS="failed"
            REASON="Contract setup, contract tests, or local-Supabase journey did not pass."
          fi
          EVIDENCE_URI="github-actions://${{ github.repository }}/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/artifacts/release-evidence-contract"
          jq -n \
            --arg status "$STATUS" \
            --arg reason "$REASON" \
            --arg runId "${{ github.run_id }}" \
            --arg commitSha "${{ github.sha }}" \
            --arg evidenceUri "$EVIDENCE_URI" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, runId: $runId, environment: "local-contract",
              candidateIdentity: $commitSha,
              results: [
                {scenarioId: "studio.config-persistence",
                  environment: "local-contract", status: $status,
                  startedAt: $generatedAt, finishedAt: $generatedAt, runner: "playwright",
                  evidence: {ui: [$evidenceUri], http: [$evidenceUri], datastore: [$evidenceUri], cleanup: [$evidenceUri]},
                  fixtures: [], notes: $reason},
                {scenarioId: "profile.snapshot-integrity",
                  environment: "local-contract", status: $status,
                  startedAt: $generatedAt, finishedAt: $generatedAt, runner: "playwright",
                  evidence: {http: [$evidenceUri], datastore: [$evidenceUri], cleanup: [$evidenceUri]},
                  fixtures: [], notes: $reason}
              ]}' \
            > .release-evidence/contract-and-local-journey.json

      - name: Upload contract and local journey evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-contract
          path: |
            .release-evidence/contract-and-local-journey.json
            apps/web/test-results/**/release-evidence.json
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build
    # WHY only lint-and-typecheck (#ci-perf): the build consumes a green
    # typecheck, not unit-test results — E2E runs against the build artifact,
    # not coverage. Dropping `test` from needs un-serializes the ~3.7min E2E
    # path from behind the ~5.5min unit suite. `test` still runs as its own
    # required gate; nothing here depends on its ordering for correctness.
    needs: [develop_push_source, lint-and-typecheck]
    if: always() && needs.develop_push_source.outputs.validated_by_pr != 'true' && needs['lint-and-typecheck'].result == 'success'
    runs-on: ubuntu-latest
    env:
      # Dummy values for build — real values are in Vercel
      GITHUB_CLIENT_ID: dummy
      GITHUB_CLIENT_SECRET: dummy
      NEXTAUTH_SECRET: dummy-secret-for-ci-32-characters
      UPSTASH_REDIS_REST_URL: https://dummy.upstash.io
      UPSTASH_REDIS_REST_TOKEN: dummy
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: build
        run: pnpm run build

      - name: Bundle size gate (350 KB per-chunk budget)
        run: bash scripts/check-bundle-size.sh 350

      - name: Upload Next.js build
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/.next/
          include-hidden-files: true
          retention-days: 1

      - name: Write build evidence
        if: always()
        env:
          PRODUCER_STATUS: ${{ job.status }}
          BUILD_STATUS: ${{ steps.build.outcome }}
        run: |
          mkdir -p .release-evidence
          STATUS="passed"
          REASON="Candidate build and bundle-size gate passed."
          if [ "$PRODUCER_STATUS" != "success" ] || [ "$BUILD_STATUS" != "success" ]; then
            STATUS="failed"
            REASON="Candidate build or bundle-size gate did not pass."
          fi
          jq -n \
            --arg scenarioId "ci.build-artifact" \
            --arg status "$STATUS" \
            --arg reason "$REASON" \
            --arg repository "${{ github.repository }}" \
            --arg runId "${{ github.run_id }}" \
            --arg runAttempt "${{ github.run_attempt }}" \
            --arg jobName "Build" \
            --arg commitSha "${{ github.sha }}" \
            --arg buildStatus "$BUILD_STATUS" \
            --arg artifactName "nextjs-build-${{ github.run_id }}-${{ github.run_attempt }}" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, scenarioId: $scenarioId, status: $status, reason: $reason,
              source: {provider: "github-actions", repository: $repository, workflowRunId: $runId,
                workflowRunAttempt: $runAttempt, jobName: $jobName, commitSha: $commitSha},
              details: {buildStatus: $buildStatus, artifactName: $artifactName},
              generatedAt: $generatedAt}' \
            > .release-evidence/build-artifact.json

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-build
          path: .release-evidence/build-artifact.json
          if-no-files-found: error
          retention-days: 30

  # WHY sharded (#ci-perf): `playwright test` (~3min, chromium + mobile
  # projects) runs unsharded. Splitting the test list across 2 shards roughly
  # halves E2E wall-clock. Each shard boots its own `next start` server against
  # the shared build artifact and runs an independent slice; only pass/fail
  # matters here (no blob/HTML report is published on success), so no report
  # merge is needed — the `e2e` gate below just aggregates results.
  # fail-fast:false so both shards report even if one fails.
  e2e-shard:
    name: E2E Shard (${{ matrix.shard }})
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      GITHUB_CLIENT_ID: dummy
      GITHUB_CLIENT_SECRET: dummy
      NEXTAUTH_SECRET: dummy-secret-for-ci-32-characters
      UPSTASH_REDIS_REST_URL: https://dummy.upstash.io
      UPSTASH_REDIS_REST_TOKEN: dummy
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
        working-directory: apps/web

      - name: Install Playwright system deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/web

      - name: Download Next.js build
        uses: actions/download-artifact@v8
        with:
          name: nextjs-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/.next/

      - name: Run E2E tests (shard ${{ matrix.shard }}/2)
        run: pnpm --filter @chapa/web exec playwright test --shard=${{ matrix.shard }}/2
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # WHY a separate gate job named exactly "E2E Tests": branch protection
  # requires a check literally named "E2E Tests", which a matrix job does not
  # produce. This aggregator preserves that required-check name and fails if any
  # E2E shard did not succeed.
  e2e:
    name: E2E Tests
    needs: [develop_push_source, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reuse verified PR validation
        if: needs.develop_push_source.outputs.validated_by_pr == 'true'
        run: echo "Exact merge SHA already passed every required PR check."

      - name: Fail if any E2E shard failed
        if: needs.develop_push_source.outputs.validated_by_pr != 'true' && needs.e2e-shard.result != 'success'
        run: |
          echo "::error::One or more E2E shards did not succeed (result: ${{ needs.e2e-shard.result }})"
          exit 1
      - if: needs.develop_push_source.outputs.validated_by_pr != 'true'
        run: echo "All E2E shards passed."

      - name: Write aggregate E2E evidence
        if: always() && needs.develop_push_source.outputs.validated_by_pr != 'true'
        env:
          PRODUCER_STATUS: ${{ job.status }}
          SHARD_STATUS: ${{ needs.e2e-shard.result }}
        run: |
          mkdir -p .release-evidence
          STATUS="passed"
          REASON="All built-artifact E2E shards passed."
          if [ "$PRODUCER_STATUS" != "success" ] || [ "$SHARD_STATUS" != "success" ]; then
            STATUS="failed"
            REASON="One or more built-artifact E2E shards did not pass."
          fi
          jq -n \
            --arg scenarioId "ci.aggregate-e2e" \
            --arg status "$STATUS" \
            --arg reason "$REASON" \
            --arg repository "${{ github.repository }}" \
            --arg runId "${{ github.run_id }}" \
            --arg runAttempt "${{ github.run_attempt }}" \
            --arg jobName "E2E Tests" \
            --arg commitSha "${{ github.sha }}" \
            --arg shardStatus "$SHARD_STATUS" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, scenarioId: $scenarioId, status: $status, reason: $reason,
              source: {provider: "github-actions", repository: $repository, workflowRunId: $runId,
                workflowRunAttempt: $runAttempt, jobName: $jobName, commitSha: $commitSha},
              details: {shardStatus: $shardStatus}, generatedAt: $generatedAt}' \
            > .release-evidence/aggregate-e2e.json

      - name: Upload aggregate E2E evidence
        if: always() && needs.develop_push_source.outputs.validated_by_pr != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-e2e
          path: .release-evidence/aggregate-e2e.json
          if-no-files-found: error
          retention-days: 30

  deployment-smoke:
    name: Deployment Smoke
    needs: [develop_push_source, build]
    if: always() && needs.develop_push_source.outputs.validated_by_pr != 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_SMOKE_BASE_URL: ${{ secrets.DEPLOYMENT_SMOKE_BASE_URL }}
    steps:
      - name: Require deployment smoke URL for production
        if: env.DEPLOYMENT_SMOKE_BASE_URL == '' && github.ref == 'refs/heads/main'
        run: |
          echo "::error::DEPLOYMENT_SMOKE_BASE_URL is required for main deployment smoke."
          exit 1

      - name: Skip deployment smoke when not configured
        id: deployment-smoke-skip
        if: env.DEPLOYMENT_SMOKE_BASE_URL == '' && github.ref != 'refs/heads/main'
        run: echo "DEPLOYMENT_SMOKE_BASE_URL is not configured; skipping deployment smoke."

      - uses: actions/checkout@v6
        if: env.DEPLOYMENT_SMOKE_BASE_URL != ''
      - uses: pnpm/action-setup@v5
        if: env.DEPLOYMENT_SMOKE_BASE_URL != ''
      - uses: actions/setup-node@v6
        if: env.DEPLOYMENT_SMOKE_BASE_URL != ''
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.DEPLOYMENT_SMOKE_BASE_URL != ''

      - name: Cache Playwright browsers
        id: deployment-playwright-cache
        if: env.DEPLOYMENT_SMOKE_BASE_URL != ''
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: env.DEPLOYMENT_SMOKE_BASE_URL != '' && steps.deployment-playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
        working-directory: apps/web

      - name: Install Playwright system deps (cached)
        if: env.DEPLOYMENT_SMOKE_BASE_URL != '' && steps.deployment-playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/web

      - name: Run deployment-shaped smoke tests
        id: deployment-smoke
        if: env.DEPLOYMENT_SMOKE_BASE_URL != ''
        working-directory: apps/web
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ env.DEPLOYMENT_SMOKE_BASE_URL }}
          DEPLOYMENT_SMOKE_STRICT: "true"
        run: npx playwright test e2e/smoke.spec.ts

      - name: Upload deployment smoke report
        if: failure() && env.DEPLOYMENT_SMOKE_BASE_URL != ''
        uses: actions/upload-artifact@v7
        with:
          name: deployment-smoke-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Write deployment smoke evidence
        if: always()
        env:
          PRODUCER_STATUS: ${{ job.status }}
          SMOKE_STATUS: ${{ steps.deployment-smoke.outcome }}
        run: |
          mkdir -p .release-evidence
          STATUS="passed"
          REASON="Configured deployment-shaped smoke tests passed."
          if [ -z "$DEPLOYMENT_SMOKE_BASE_URL" ]; then
            STATUS="skipped"
            REASON="DEPLOYMENT_SMOKE_BASE_URL was not configured."
          elif [ "$PRODUCER_STATUS" != "success" ] || [ "$SMOKE_STATUS" != "success" ]; then
            STATUS="failed"
            REASON="Configured deployment-shaped smoke tests did not pass."
          fi
          jq -n \
            --arg scenarioId "ci.deployment-smoke" \
            --arg status "$STATUS" \
            --arg reason "$REASON" \
            --arg repository "${{ github.repository }}" \
            --arg runId "${{ github.run_id }}" \
            --arg runAttempt "${{ github.run_attempt }}" \
            --arg jobName "Deployment Smoke" \
            --arg commitSha "${{ github.sha }}" \
            --arg smokeStatus "$SMOKE_STATUS" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, scenarioId: $scenarioId, status: $status, reason: $reason,
              source: {provider: "github-actions", repository: $repository, workflowRunId: $runId,
                workflowRunAttempt: $runAttempt, jobName: $jobName, commitSha: $commitSha},
              details: {smokeStatus: $smokeStatus}, generatedAt: $generatedAt}' \
            > .release-evidence/deployment-smoke.json

      - name: Upload deployment smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-deployment-smoke
          path: .release-evidence/deployment-smoke.json
          if-no-files-found: error
          retention-days: 30

  # WHY scoped to the release PR only (#1011): this check confirms
  # supabase/migrations/ has actually been applied to the linked production
  # project. That question only matters right before a develop -> main
  # release merges — running it on every push to develop would be noise (and
  # would burn Management API calls against production for no reason).
  pending-migrations-check:
    name: Pending Migrations Check (release PR)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    env:
      # SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF do not exist as repo
      # secrets yet — see docs/runbooks/migrations.md "Automated CI Gate
      # (#1011)". Until a human adds them, this job logs a clear skip
      # message below instead of failing every release PR.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Skip when Supabase production credentials are not configured
        id: pending-migrations-skip
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == ''
        run: |
          echo "::notice::SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF secrets are not configured — skipping the automated pending-migrations check for this release PR. Confirm manually via the 'Pre-Deploy Migration Check' steps in docs/runbooks/migrations.md before merging."

      - uses: actions/checkout@v6
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
      - uses: pnpm/action-setup@v5
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
      - uses: actions/setup-node@v6
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''

      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        with:
          version: latest

      - name: Check for pending migrations against linked production project
        id: pending-migrations
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: pnpm run check:pending-migrations

      - name: Write pending migration evidence
        if: always()
        env:
          PRODUCER_STATUS: ${{ job.status }}
          MIGRATION_STATUS: ${{ steps.pending-migrations.outcome }}
        run: |
          mkdir -p .release-evidence
          STATUS="passed"
          REASON="No pending production migrations were detected."
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            STATUS="skipped"
            REASON="Supabase production credentials were not configured."
          elif [ "$PRODUCER_STATUS" != "success" ] || [ "$MIGRATION_STATUS" != "success" ]; then
            STATUS="failed"
            REASON="Pending migration check did not pass."
          fi
          jq -n \
            --arg status "$STATUS" \
            --arg reason "$REASON" \
            --arg runId "${{ github.run_id }}" \
            --arg commitSha "${{ github.event.pull_request.head.sha }}" \
            --arg evidenceUri "github-actions://${{ github.repository }}/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs/pending-migrations" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, runId: $runId, environment: "ci-build",
              candidateIdentity: $commitSha,
              results: [{scenarioId: "database.pending-migrations",
                environment: "ci-build", status: $status,
                startedAt: $generatedAt, finishedAt: $generatedAt, runner: "script",
                evidence: {datastore: [$evidenceUri]}, fixtures: [], notes: $reason}]}' \
            > .release-evidence/pending-production-migrations.json

      - name: Upload pending migration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}-pending-migrations
          path: .release-evidence/pending-production-migrations.json
          if-no-files-found: error
          retention-days: 30
