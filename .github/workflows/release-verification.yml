name: Release Verification
run-name: Release proof for ${{ inputs.developCommit }} (${{ inputs.runId }})

on:
  workflow_dispatch:
    inputs:
      baselineTag:
        description: Immutable baseline semantic-version tag currently live in production
        required: true
        type: string
      developCommit:
        description: Full develop commit SHA deployed to the Preview
        required: true
        type: string
      candidateTreeDigest:
        description: Full Git tree SHA for the candidate
        required: true
        type: string
      previewUrl:
        description: Immutable Vercel Preview deployment URL
        required: true
        type: string
      runId:
        description: Stable path-safe result run identifier
        required: true
        type: string
  workflow_call:
    inputs:
      baselineTag:
        required: true
        type: string
      developCommit:
        required: true
        type: string
      candidateTreeDigest:
        required: true
        type: string
      previewUrl:
        required: true
        type: string
      runId:
        required: true
        type: string
    secrets:
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: true
    outputs:
      status:
        description: Direct check status for the Preview proof (passed|failed)
        value: ${{ jobs.preview-proof.outputs.status }}
      artifactName:
        description: The uploaded release-result artifact name
        value: release-result-${{ inputs.runId }}-${{ github.run_attempt }}

permissions:
  contents: read

concurrency:
  group: release-verification-${{ inputs.developCommit }}-${{ inputs.runId }}
  cancel-in-progress: false

jobs:
  preview-proof:
    name: Preview Proof
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.write-result.outcome == 'success' && 'passed' || 'failed' }}
    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
      BASELINE_TAG: ${{ inputs.baselineTag }}
      DEVELOP_COMMIT: ${{ inputs.developCommit }}
      CANDIDATE_TREE_DIGEST: ${{ inputs.candidateTreeDigest }}
      PREVIEW_URL: ${{ inputs.previewUrl }}
      RUN_ID: ${{ inputs.runId }}
      RUN_DIRECTORY: quality/evidence/runs/${{ inputs.runId }}
    steps:
      - name: Validate immutable input shape
        run: |
          set -euo pipefail
          [[ "$DEVELOP_COMMIT" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::developCommit must be a lowercase full SHA."; exit 1; }
          [[ "$CANDIDATE_TREE_DIGEST" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::candidateTreeDigest must be a lowercase full tree SHA."; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]] ||
            { echo "::error::runId must be path-safe."; exit 1; }
          node <<'NODE'
          const url = new URL(process.env.PREVIEW_URL);
          const immutableHost =
            /^chapa-[a-z0-9]+-thecreativetoken\.vercel\.app$/.test(url.hostname);
          if (
            url.protocol !== "https:" ||
            !immutableHost ||
            url.hostname.includes("-git-") ||
            url.pathname !== "/" ||
            url.search ||
            url.hash
          ) {
            throw new Error(
              "previewUrl must be the immutable Chapa Vercel deployment URL, not a branch alias",
            );
          }
          NODE

      - name: Require Vercel automation bypass secret
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET" || {
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is required for protected Preview proof."
            exit 1
          }

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.developCommit }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify checked-out source and tree identity
        id: source-identity
        continue-on-error: true
        run: |
          set -euo pipefail
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          ACTUAL_TREE="$(git rev-parse 'HEAD^{tree}')"
          test "$ACTUAL_COMMIT" = "$DEVELOP_COMMIT" || {
            echo "::error::Checked-out commit $ACTUAL_COMMIT does not match $DEVELOP_COMMIT."
            exit 1
          }
          test "$ACTUAL_TREE" = "$CANDIDATE_TREE_DIGEST" || {
            echo "::error::Candidate tree $ACTUAL_TREE does not match $CANDIDATE_TREE_DIGEST."
            exit 1
          }

      - name: Fetch only the immutable baseline
        run: |
          set -euo pipefail
          git fetch --depth=1 origin tag "$BASELINE_TAG"
          git rev-parse --verify "${BASELINE_TAG}^{commit}" >/dev/null

      # Verified here via git + a direct production read, independent of the
      # rollback.readiness Playwright scenario that "Run default Preview
      # probes" below deliberately excludes — one mechanism per compact-result
      # check field, not two disagreeing sources for the same fact.
      - name: Verify rollback readiness against current production
        id: rollback-readiness
        continue-on-error: true
        run: |
          set -euo pipefail
          TAG_TYPE="$(git cat-file -t "$BASELINE_TAG")"
          test "$TAG_TYPE" = "tag" || {
            echo "::error::$BASELINE_TAG must be an annotated tag."
            exit 1
          }
          TAG_COMMIT="$(git rev-parse "${BASELINE_TAG}^{commit}")"
          PRODUCTION_JSON="$(curl -sf https://chapa.thecreativetoken.com/api/version)"
          PRODUCTION_COMMIT="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(0,"utf8")).commitSha ?? "")' <<< "$PRODUCTION_JSON")"
          test "$PRODUCTION_COMMIT" = "$TAG_COMMIT" || {
            echo "::error::Production identity $PRODUCTION_COMMIT does not match baseline tag $BASELINE_TAG ($TAG_COMMIT)."
            exit 1
          }

      - name: Verify Preview deployment identity
        id: preview-identity
        continue-on-error: true
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIRECTORY"
          jq -n \
            --arg developCommit "$DEVELOP_COMMIT" \
            --arg candidateTreeDigest "$CANDIDATE_TREE_DIGEST" \
            --arg previewUrl "$PREVIEW_URL" \
            '{developCommit: $developCommit, candidateTreeDigest: $candidateTreeDigest, previewUrl: $previewUrl}' \
            > "$RUN_DIRECTORY/identity-candidate.json"
          pnpm run release:verify-identity -- \
            --candidate "$RUN_DIRECTORY/identity-candidate.json" \
            --output "$RUN_DIRECTORY/identity-evidence.json"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @chapa/web exec playwright install chromium --with-deps

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @chapa/web exec playwright install-deps chromium

      # Deliberately grep-excludes the identity and rollback scenarios: those
      # are already verified above by dedicated git/script steps that feed
      # their own compact-result check fields (previewIdentity,
      # rollbackReadiness). This step's outcome feeds only previewProbes.
      - name: Run default Preview probes
        id: preview-probes
        continue-on-error: true
        env:
          EXPECTED_DEPLOYMENT_COMMIT: ${{ inputs.developCommit }}
          EXPECTED_DEPLOYMENT_ENV: preview
          RELEASE_VERIFICATION_MODE: default
          PLAYWRIGHT_BASE_URL: ${{ inputs.previewUrl }}
          DEPLOYMENT_SMOKE_STRICT: "true"
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          pnpm --filter @chapa/web exec playwright test \
            e2e/release-required.spec.ts \
            --grep @release-required \
            --grep-invert "deployment\.(preview|production)-identity|rollback\.readiness" \
            --project=chromium

      - name: Build release-result input
        id: build-input
        if: always()
        env:
          SOURCE_IDENTITY_OUTCOME: ${{ steps.source-identity.outcome }}
          ROLLBACK_READINESS_OUTCOME: ${{ steps.rollback-readiness.outcome }}
          PREVIEW_IDENTITY_OUTCOME: ${{ steps.preview-identity.outcome }}
          PREVIEW_PROBES_OUTCOME: ${{ steps.preview-probes.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$RUN_DIRECTORY"
          status() { test "$1" = "success" && echo passed || echo failed; }
          jq -n \
            --arg baselineTag "$BASELINE_TAG" \
            --arg developCommit "$DEVELOP_COMMIT" \
            --arg candidateTreeDigest "$CANDIDATE_TREE_DIGEST" \
            --arg previewUrl "$PREVIEW_URL" \
            --arg repository "${{ github.repository }}" \
            --arg workflowRunId "${{ github.run_id }}" \
            --arg workflowRunAttempt "${{ github.run_attempt }}" \
            --arg sourceIdentity "$(status "$SOURCE_IDENTITY_OUTCOME")" \
            --arg previewIdentity "$(status "$PREVIEW_IDENTITY_OUTCOME")" \
            --arg previewProbes "$(status "$PREVIEW_PROBES_OUTCOME")" \
            --arg rollbackReadiness "$(status "$ROLLBACK_READINESS_OUTCOME")" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              mode: "default",
              candidate: {
                baselineTag: $baselineTag,
                rollbackReference: $baselineTag,
                developCommit: $developCommit,
                candidateTreeDigest: $candidateTreeDigest,
                previewUrl: $previewUrl
              },
              source: {
                repository: $repository,
                workflowRunId: $workflowRunId,
                workflowRunAttempt: $workflowRunAttempt,
                headSha: $developCommit
              },
              checks: {
                sourceIdentity: $sourceIdentity,
                previewIdentity: $previewIdentity,
                previewProbes: $previewProbes,
                rollbackReadiness: $rollbackReadiness
              },
              generatedAt: $generatedAt
            }' > "$RUN_DIRECTORY/release-result-input.json"

      - name: Write release result
        id: write-result
        if: always()
        run: |
          pnpm run release:write-result -- \
            --stage preview \
            --input "$RUN_DIRECTORY/release-result-input.json" \
            --output "$RUN_DIRECTORY/release-result.json"

      - name: Upload release result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-result-${{ inputs.runId }}-${{ github.run_attempt }}
          path: quality/evidence/runs/${{ inputs.runId }}/release-result.json
          if-no-files-found: error
          retention-days: 30
