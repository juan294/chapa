name: Sutura repair monitor
run-name: "${{ format('Sutura monitor: {0} #{1} ({2} / {3})', github.event.workflow_run.name, github.event.workflow_run.run_number, github.event.workflow_run.event, github.event.workflow_run.conclusion) }}"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: write
  pull-requests: write

concurrency:
  group: sutura-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  repair:
    name: Attempt verified CI repair
    if: >-
      ${{
        github.event.workflow_run.event == 'pull_request' &&
        (github.event.workflow_run.conclusion == 'failure' ||
         github.event.workflow_run.conclusion == 'timed_out')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify and repair failed CI
        uses: juan294/sutura@4e177b38cd43cc7233873b4455d4dc18dee706b8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          capture-replay: true
          runtime: auto
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          contree-token: ${{ secrets.CONTREE_TOKEN }}
          contree-project: ${{ vars.CONTREE_PROJECT }}
